name: offline-build
on: [push, pull_request]
permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Build the source tarball
        run: R CMD build --no-build-vignettes .
      - name: Size gate
        run: |
          size=$(stat -c %s redisrs_*.tar.gz)
          echo "tarball bytes: $size"
          test "$size" -lt 5000000
      - name: Install without network
        run: |
          rm -rf ~/.cargo/registry ~/.cargo/git
          sudo unshare -n env PATH="$PATH" HOME="$HOME" NOT_CRAN=false R CMD INSTALL redisrs_*.tar.gz
