name: R-CMD-check
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      # R CMD check --as-cran checks configure with checkbashisms (Debian devscripts).
      - name: Install checkbashisms
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends devscripts
      - name: Skip the bashisms check where checkbashisms is not available
        if: runner.os != 'Linux'
        shell: bash
        run: echo "_R_CHECK_BASHISMS_=false" >> "$GITHUB_ENV"
      - name: Start test servers
        if: runner.os == 'Linux'
        run: |
          tests/servers/gen-certs.sh
          docker compose -f tests/servers/docker-compose.yml up -d
          timeout 60 sh -c 'until docker compose -f tests/servers/docker-compose.yml exec -T cluster valkey-cli -p 7000 cluster info | grep -q cluster_state:ok; do sleep 1; done'
          echo "REDISRS_TEST_SERVERS=true" >> "$GITHUB_ENV"
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Rust unit tests
        if: runner.os == 'Linux'
        # The test binary loads libR.so at run time, and the runner's R is not
        # registered with ldconfig.
        run: |
          cd src/rust
          export R_HOME=$(R RHOME)
          LD_LIBRARY_PATH="$R_HOME/lib" cargo test
