name: R-CMD-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Start test servers
        if: runner.os == 'Linux'
        run: |
          tests/servers/gen-certs.sh
          docker compose -f tests/servers/docker-compose.yml up -d
          sleep 5
          echo "REDISRS_TEST_SERVERS=true" >> "$GITHUB_ENV"
      - uses: r-lib/actions/check-r-package@v2
      - name: Rust unit tests
        if: runner.os == 'Linux'
        run: cd src/rust && R_HOME=$(R RHOME) cargo test
